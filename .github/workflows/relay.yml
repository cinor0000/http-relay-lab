name: relay
on:
  workflow_dispatch:
    inputs:
      minutes:  { description: how long, default: "120" }
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install devtunnel
        run: |
          curl -fsSL https://aka.ms/TunnelsCliDownload/linux-x64 -o devtunnel
          chmod +x devtunnel
          ./devtunnel --version
      - name: run relay behind a dev tunnel
        env:
          PSK: ${{ secrets.PSK }}
          DEVTUNNEL_TOKEN: ${{ secrets.DEVTUNNEL_TOKEN }}
          MINUTES: ${{ github.event.inputs.minutes }}
        run: |
          set -e
          test -n "$PSK" || { echo "PSK secret missing"; exit 1; }
          test -n "$DEVTUNNEL_TOKEN" || { echo "DEVTUNNEL_TOKEN secret missing"; exit 1; }
          python3 relay_server.py --transport ws --port 8080 --psk "$PSK" --suite shake256-hmac > server.log 2>&1 &
          # מארחים את המנהרה הקבועה עם טוקן האירוח בלבד — בלי התחברות.
          # *בלי* -p ובלי --allow-anonymous: פורט 8080 והגישה האנונימית כבר
          # מוגדרים במנהרה מהיצירה. כל דגל שמנסה לשנות פורט/גישה מפעיל פעולת
          # ניהול שדורשת הרשאת manage שאין לטוקן host, וגם נכשל ב"batch update
          # of ports". host בלי דגלים מארח את הפורט הקיים עם host בלבד.
          #
          # watchdog: ‏devtunnel host קורס לפעמים בשקט (ניתוק מה-relay), וה-job
          # היה ממשיך ל-sleep עם מנהרה מתה. לכן מריצים אותו בלולאה שמקימה אותו
          # מחדש בכל פעם שהוא יוצא, עד תום תקציב הזמן.
          END=$(( $(date +%s) + MINUTES * 60 ))
          attempt=0
          while [ "$(date +%s)" -lt "$END" ]; do
            attempt=$(( attempt + 1 ))
            echo "[watchdog] starting devtunnel host (attempt $attempt) at $(date -u +%H:%M:%S)"
            ./devtunnel host relaylab.uks1 -t "$DEVTUNNEL_TOKEN" 2>&1 | sed 's/^/[host] /' || true
            echo "[watchdog] devtunnel host exited; restarting in 3s"
            sleep 3
          done
          echo "time budget reached; exiting"
